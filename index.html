<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- ============================================================
         PRIMARY SEO — Title + Description
         Title: 57 chars
         Description: 152 chars
         Tone: personal, first-person — not an ad
    ============================================================ -->
    <title>Ritesh Kumar Jha | Freelance Web Developer Mumbai & MERN Stack Developer India</title>
    <meta name="description" content="Ritesh Kumar Jha — freelance web developer in Mumbai and MERN stack developer serving clients across India. I build fast, custom React + Node.js web apps for startups and small businesses. Available for freelance & full-time work." />

    <!-- ============================================================
         EXTENDED META
    ============================================================ -->
    <meta name="author" content="Ritesh Jha" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://jharitesh.me/" />

    <!-- Keywords: Tier 1 Mumbai + India geo mix -->
    <meta name="keywords" content="freelance web developer Mumbai, MERN stack developer India, hire React developer, Node.js developer for hire, custom web app development India, web developer Thane" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="MLbNdO4i9Xbl00yBBUBM9OTTLQveG_lYsUOdkxOi22s" />

    <!-- ============================================================
         OPEN GRAPH — Facebook / LinkedIn / WhatsApp
         Personal tone — sounds like a real person, not a gig listing
    ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jharitesh.me/" />
    <meta property="og:site_name" content="Ritesh Jha" />
    <meta property="og:title" content="Ritesh Kumar Jha | Freelance Web Developer Mumbai & MERN Stack Developer India" />
    <meta
      property="og:description"
      content="Full-stack MERN developer based in Mumbai building custom web apps for startups and small businesses across India. React, Node.js, Express, MongoDB."
    />
    <meta property="og:image" content="https://jharitesh.me/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ritesh Kumar Jha, freelance web developer Mumbai — MERN stack developer portfolio hero" />
    <meta property="og:locale" content="en_IN" />

    <!-- ============================================================
         TWITTER / X CARD
         Casual — sounds like something you'd actually post
    ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jharitesh.me/" />
    <meta name="twitter:title" content="Ritesh Jha — MERN Stack Developer, Mumbai" />
    <meta
      name="twitter:description"
      content="CS student from Mumbai. I build web apps with React and Node.js on the side. Open to freelance work across India."
    />
    <meta name="twitter:image" content="https://jharitesh.me/og-image.jpg" />
    <meta name="twitter:creator" content="@jharitesh" />

    <!-- ============================================================
         JSON-LD STRUCTURED DATA
         BUG FIX: was "ld+ json" (with space) — now correctly "ld+json"
         Google was silently ignoring the entire schema block before.
    ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Ritesh Kumar Jha",
      "jobTitle": "Freelance Web Developer",
      "url": "https://jharitesh.me",
      "email": "jharitesh148@gmail.com",
      "telephone": "+91-9588499371",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Thane",
        "addressRegion": "Maharashtra",
        "addressCountry": "India"
      },
      "sameAs": [
        "https://linkedin.com/in/just-ritesh21"
      ],
      "knowsAbout": ["MERN Stack", "React", "Node.js", "Express.js", "MongoDB", "Web Development"]
    }
    </script>

    <!-- ============================================================
         FONTS + TAILWIND
    ============================================================ -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "space-black": "#050505",
              "luxury-gray": "#121212",
              "neon-blue": "#00B4FF",
              "glass-border": "rgba(255, 255, 255, 0.1)",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              heading: ["Outfit", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-space-black text-white font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
